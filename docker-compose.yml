services:
  mitten-os:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    image: mitten-os:latest
    container_name: mitten-os
    restart: unless-stopped
    ports:
      - "3130:3130"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3130
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3130/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true